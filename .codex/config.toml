[mcp_servers.harness-aci]
command = "powershell.exe"
# Codex passes MCP arguments through unchanged.  Keep -File absolute so Desktop
# can start the server even when its process cwd is outside this repository.
args = ["-NoLogo", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "C:\\Users\\romer\\Documents\\GitHub\\harnes\\scripts\\start_aci_mcp.ps1"]
enabled = true
required = true
startup_timeout_sec = 30
tool_timeout_sec = 180

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 1800
