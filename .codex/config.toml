[mcp_servers.harness-aci]
command = "powershell.exe"
# Codex starts this project-scoped MCP process in the repository root.  Keep
# both the working directory and launcher path relative so another checkout
# does not inherit the compiler host's user or drive path.
args = ["-NoLogo", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-File", "scripts/start_aci_mcp.ps1"]
cwd = "."
enabled = true
required = true
startup_timeout_sec = 30
tool_timeout_sec = 180

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 1800
