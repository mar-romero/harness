name: Harness
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generated adapters
        run: python scripts/compile_harness.py --check
      - name: Run harness audit, unit tests and deterministic evals
        run: bash scripts/check-harness.sh
